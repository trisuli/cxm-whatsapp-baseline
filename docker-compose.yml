# Local development: Postgres only. Run the app with `npm run dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cxm
      POSTGRES_PASSWORD: cxm
      POSTGRES_DB: cxm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cxm -d cxm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cxm:cxm@db:5432/cxm
      PORT: 3000
      WA_DRY_RUN: "true"
      DEV_SIMULATOR: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: